name: CI

on:
  push:
    branches: [ "ci/cd" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  JACOCO_VERSION: "0.8.12"
  COVERAGE_MIN: "0.7"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build (no tests)
        run: ./mvnw -B -DskipTests clean package

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Lint
        run: ./mvnw clean checkstyle:check

  test_coverage:
    name: test+coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests with JaCoCo
        run: >
          ./mvnw -B
          org.jacoco:jacoco-maven-plugin:${{ env.JACOCO_VERSION }}:prepare-agent
          test -Dtest="!**/repository/**/*Test"
          org.jacoco:jacoco-maven-plugin:${{ env.JACOCO_VERSION }}:report

      - name: Check coverage threshold
        run: ./mvnw jacoco:check -Djacoco.minimum.coverage=${{ env.COVERAGE_MIN }}

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
  build-docker:
    name: build-docker
    runs-on: ubuntu-latest
    needs: test_coverage
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/setup-buildx-action@v4
      
      - name: List files in root
        run: ls -la

      - name: Build and test
        uses: docker/build-push-action@v7
        with:
          load: true
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }}